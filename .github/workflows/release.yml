name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate branch
        run: |
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          if [ "$CURRENT_BRANCH" != "master" ]; then
            echo "Error: Releases can only be created from master branch"
            echo "Current branch: $CURRENT_BRANCH"
            exit 1
          fi

      - name: Read base version and compute next patch from tags
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f version.txt ]; then
            echo "Error: version.txt not found"
            exit 1
          fi

          BASE_VERSION="$(tr -d '[:space:]' < version.txt)"
          if [ -z "$BASE_VERSION" ]; then
            echo "Error: version.txt is empty"
            exit 1
          fi

          # BASE_VERSION must be MAJOR.MINOR.PATCH (we treat this as "base", but do not commit changes)
          if ! echo "$BASE_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: Invalid version format in version.txt: $BASE_VERSION"
            echo "Expected format: MAJOR.MINOR.PATCH (e.g., 1.0.0)"
            exit 1
          fi

          MAJOR="$(echo "$BASE_VERSION" | cut -d. -f1)"
          MINOR="$(echo "$BASE_VERSION" | cut -d. -f2)"
          BASE_PATCH="$(echo "$BASE_VERSION" | cut -d. -f3)"

          # Find latest existing tag for this MAJOR.MINOR.* line
          # Tags expected format: vX.Y.Z
          LAST_TAG="$(git tag -l "v${MAJOR}.${MINOR}.*" --sort=-v:refname | head -n 1 || true)"

          if [ -z "$LAST_TAG" ]; then
            # No tags yet for this line; start at BASE_PATCH + 1 (or BASE_PATCH, but you wanted auto-increment)
            NEXT_PATCH="$((BASE_PATCH + 1))"
          else
            # Extract patch from LAST_TAG and increment
            LAST_PATCH="$(echo "$LAST_TAG" | sed -E "s/^v${MAJOR}\.${MINOR}\.([0-9]+)$/\1/")"
            if ! echo "$LAST_PATCH" | grep -qE '^[0-9]+$'; then
              echo "Error: Could not parse patch from last tag: $LAST_TAG"
              exit 1
            fi
            NEXT_PATCH="$((LAST_PATCH + 1))"
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}"
          TAG="v${NEW_VERSION}"

          echo "Base version from version.txt: $BASE_VERSION"
          echo "Last tag for line v${MAJOR}.${MINOR}.*: ${LAST_TAG:-<none>}"
          echo "New version: $NEW_VERSION"
          echo "New tag: $TAG"

          # Guard: do not overwrite existing tag
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Error: Tag $TAG already exists"
            exit 1
          fi

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag (no master pushes)
        run: |
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Build release artifacts
        run: |
          ./gradlew :droiddeploy:assembleRelease
          ./gradlew :droiddeploy:sourcesJar

      - name: Verify artifacts exist
        run: |
          if [ ! -f droiddeploy/build/outputs/aar/droiddeploy-release.aar ]; then
            echo "Error: AAR file not found at expected path"
            exit 1
          fi
          if [ ! -f droiddeploy/build/libs/droiddeploy-sources.jar ]; then
            echo "Error: Sources JAR not found at expected path"
            exit 1
          fi
          echo "All artifacts found successfully"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            droiddeploy/build/outputs/aar/droiddeploy-release.aar
            droiddeploy/build/libs/droiddeploy-sources.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate branch
        run: |
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          if [ "$CURRENT_BRANCH" != "master" ]; then
            echo "Error: Releases can only be created from master branch"
            echo "Current branch: $CURRENT_BRANCH"
            exit 1
          fi

      - name: Read and increment version
        id: version
        run: |
          if [ ! -f version.txt ]; then
            echo "Error: version.txt not found"
            exit 1
          fi

          VERSION=$(cat version.txt | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "Error: version.txt is empty"
            exit 1
          fi

          # Validate version format (MAJOR.MINOR.PATCH)
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: Invalid version format in version.txt: $VERSION"
            echo "Expected format: MAJOR.MINOR.PATCH (e.g., 1.0.0)"
            exit 1
          fi

          # Extract version parts
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)

          # Increment patch version
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"

          echo "Current version: $VERSION"
          echo "New version: $NEW_VERSION"

          # Save new version to file
          echo "$NEW_VERSION" > version.txt

          # Export for later steps
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit version change
        run: |
          git add version.txt
          git commit -m "Release v${{ steps.version.outputs.version }}"

      - name: Create and push tag
        run: |
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin master
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Build release artifacts
        run: |
          ./gradlew :droiddeploy:assembleRelease
          ./gradlew :droiddeploy:sourcesJar

      - name: Verify artifacts exist
        run: |
          if [ ! -f droiddeploy/build/outputs/aar/droiddeploy-release.aar ]; then
            echo "Error: AAR file not found at expected path"
            exit 1
          fi
          if [ ! -f droiddeploy/build/libs/droiddeploy-sources.jar ]; then
            echo "Error: Sources JAR not found at expected path"
            exit 1
          fi
          echo "All artifacts found successfully"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            droiddeploy/build/outputs/aar/droiddeploy-release.aar
            droiddeploy/build/libs/droiddeploy-sources.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
